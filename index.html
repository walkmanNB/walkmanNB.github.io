<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的私人书架</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* 木质层架效果 */
        .shelf-board {
            border-bottom: 12px solid #5d3a1a; /* 木板厚度 */
            box-shadow: 0 10px 10px -5px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
            display: flex;
            align-items: flex-end;
            min-height: 180px;
            padding-bottom: 10px;
        }
    </style>
</head>
<body class="bg-stone-50 min-h-screen py-10" x-data="library()">

    <div class="max-w-6xl mx-auto px-4">
        <h1 class="text-4xl font-serif mb-10 text-stone-800 text-center">📖 我的私人书架</h1>

        <!-- 书架容器 -->
        <div class="bg-stone-100 p-8 rounded-lg shadow-inner">
            <div class="shelf-board gap-6">
                <template x-for="book in books" :key="book.id">
                    <!-- 书籍卡片 -->
                    <div class="group relative flex flex-col items-center flex-shrink-0 transition-transform duration-300 hover:-translate-y-4">
                        <!-- 书脊/封面 -->
                        <div class="w-24 h-36 bg-white shadow-lg border-l-4 border-stone-200 overflow-hidden relative cursor-pointer">
                            <img :src="book.cover" class="w-full h-full object-cover" alt="封面">
                            <!-- 遮罩层 -->
                            <div class="absolute inset-0 bg-stone-900/70 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center gap-2 transition">
                                <a :href="book.file_url" target="_blank" class="text-white text-[10px] bg-indigo-600 px-3 py-1 rounded-full hover:bg-indigo-500">下载</a>
                                <a :href="'https://github.com/你的用户名/你的仓库名/issues?q=' + encodeURIComponent(book.title)" target="_blank" class="text-white text-[10px] bg-stone-600 px-3 py-1 rounded-full hover:bg-stone-500">讨论</a>
                            </div>
                        </div>
                        <!-- 书名 -->
                        <span class="text-[10px] mt-3 text-stone-600 font-bold w-24 text-center truncate" x-text="book.title"></span>
                    </div>
                </template>
            </div>
            
            <!-- 如果书架为空 -->
            <template x-if="books.length === 0">
                <div class="text-center text-stone-400 py-10">书架空空如也，请在 books.json 添加书籍...</div>
            </template>
        </div>
    </div>

    <script>
        function library() {
            return {
                books: [],
                async init() {
                    try {
                        const res = await fetch('books.json');
                        if (!res.ok) throw new Error('无法读取书籍数据');
                        this.books = await res.json();
                    } catch (e) {
                        console.error('加载错误:', e);
                    }
                }
            }
        }
    </script>
</body>
</html>
