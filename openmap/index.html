<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMap - 实时定位与真实GPS导航</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100%; }

        /* 顶部悬浮搜索框 */
        .search-container {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            background: #fff;
            width: 390px;
            max-width: calc(100vw - 32px);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.22);
            padding: 4px 12px;
            transition: transform 0.3s ease;
        }
        .search-container input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 8px;
            font-size: 15px;
            color: #202124;
        }
        .search-container button {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            color: #5f6368;
        }
        .search-container button:hover { color: #1a73e8; }

        /* 侧边栏 */
        .sidebar {
            position: absolute;
            top: 72px;
            left: 16px;
            width: 390px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 96px);
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            z-index: 15;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(-430px);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        .sidebar.active {
            transform: translateX(0);
            opacity: 1;
        }

        .poi-media-cover {
            width: 100%;
            height: 180px;
            background-color: #e8eaed;
            position: relative;
            overflow: hidden;
            display: none;
        }
        .poi-media-cover img { width: 100%; height: 100%; object-fit: cover; }

        .sidebar-header {
            position: relative;
            background: #ffffff;
            color: #202124;
            padding: 18px 20px 10px 20px;
            border-bottom: 1px solid #f1f3f4;
        }
        .sidebar-header .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: #f1f3f4;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f6368;
            font-size: 14px;
        }
        .sidebar-header .close-btn:hover { background: #dadce0; color: #202124; }
        .sidebar-header h2 { font-size: 20px; font-weight: 500; margin-bottom: 6px; padding-right: 28px; line-height: 1.3; }

        .rating-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #5f6368;
            margin-bottom: 6px;
        }
        .rating-score { font-weight: 600; color: #e37400; font-size: 14px; }
        .rating-stars { color: #e37400; letter-spacing: 2px; font-size: 12px; }
        .sidebar-header .category { font-size: 13px; color: #70757a; text-transform: capitalize; }

        .action-row {
            display: flex;
            justify-content: space-around;
            padding: 12px 10px;
            border-bottom: 1px solid #f1f3f4;
            background: #ffffff;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 6px;
            color: #1a73e8;
            font-size: 12px;
            font-weight: 500;
        }
        .action-btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #dadce0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a73e8;
        }
        .action-btn:hover .action-btn-icon { background: #e8f0fe; }

        .details-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .summary-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #3c4043;
            border-left: 3px solid #1a73e8;
        }
        .summary-card .source-tag { display: block; margin-top: 8px; font-size: 11px; color: #70757a; }
        .info-row { display: flex; align-items: flex-start; gap: 16px; font-size: 14px; color: #3c4043; line-height: 1.4; }
        .info-row svg { flex-shrink: 0; color: #5f6368; margin-top: 2px; }

        /* 路线面板 */
        .routing-view {
            display: none;
            padding: 16px 20px;
            overflow-y: auto;
        }
        .travel-modes { display: flex; gap: 8px; margin-bottom: 12px; }
        .mode-btn {
            flex: 1; padding: 6px 0; border: 1px solid #dadce0; background: #fff;
            border-radius: 6px; font-size: 13px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 4px; color: #5f6368;
        }
        .mode-btn.active { background: #e8f0fe; color: #1a73e8; border-color: #1a73e8; font-weight: 500; }
        
        .route-summary-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .route-time { font-size: 20px; font-weight: bold; color: #188038; }
        .route-dist { font-size: 13px; color: #5f6368; }
        
        .start-nav-btn {
            background: #1a73e8; color: #fff; border: none; padding: 10px 20px;
            border-radius: 24px; font-size: 14px; font-weight: 500; cursor: pointer;
            box-shadow: 0 2px 6px rgba(26,115,232,0.4);
        }
        .start-nav-btn:hover { background: #1557b0; }

        .steps-list { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #f1f3f4; padding-top: 10px; }
        .step-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; color: #3c4043; }
        .step-num {
            background: #e8f0fe; color: #1a73e8; font-size: 11px; width: 20px; height: 20px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        /* 顶部导航 HUD */
        .nav-hud {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-140px);
            z-index: 30;
            background: #1a73e8;
            color: #fff;
            padding: 14px 22px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 320px;
            transition: transform 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        .nav-hud.active { transform: translateX(-50%) translateY(0); }
        .hud-instruction { font-size: 16px; font-weight: 600; }
        .hud-sub { font-size: 12px; opacity: 0.9; }
        .exit-nav-btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
        }

        /* 底部 GPS 状态徽章 */
        .status-badge {
            position: absolute; bottom: 24px; left: 16px; z-index: 10;
            background: rgba(255, 255, 255, 0.95); padding: 7px 16px;
            border-radius: 20px; font-size: 12px; color: #3c4043; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 8px;
        }
        .gps-indicator {
            width: 8px; height: 8px; border-radius: 50%; background: #ea4335;
        }
        .gps-indicator.online { background: #34a853; }
    </style>
</head>
<body>

    <div class="search-container" id="search-bar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <input type="text" id="search-input" placeholder="搜索地点或在地图上点击目标..." />
        <button id="search-btn" title="搜索">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </button>
    </div>

    <div class="sidebar" id="poi-sidebar">
        <div class="poi-media-cover" id="poi-cover">
            <img id="cover-img" src="" alt="POI 图片" />
        </div>

        <div class="sidebar-header" id="poi-header-view">
            <button class="close-btn" id="close-sidebar" title="关闭">✕</button>
            <h2 id="poi-title">地点加载中...</h2>
            <div class="rating-bar" id="rating-bar">
                <span class="rating-score" id="rating-val">4.6</span>
                <span class="rating-stars" id="rating-stars">★★★★★</span>
                <span id="reviews-count">(1,280 条评价)</span>
            </div>
            <div class="category" id="poi-category">地名信息</div>
        </div>

        <div class="action-row" id="poi-actions-view">
            <button class="action-btn" id="trigger-route-btn">
                <div class="action-btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.71 11.29l-9-9a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 0 1.42l9 9a1 1 0 0 0 1.42 0l9-9a1 1 0 0 0 0-1.42zm-8.71 6.3V14h-4v-4h4V6.41L18.59 12 13 17.59z"/></svg>
                </div>
                路线
            </button>
            <button class="action-btn" id="copy-coord-btn">
                <div class="action-btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </div>
                复制坐标
            </button>
            <button class="action-btn" onclick="alert('分享链接已复制')">
                <div class="action-btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                </div>
                分享
            </button>
        </div>

        <div class="details-body" id="poi-details-view">
            <div class="summary-card" id="poi-summary-box" style="display: none;">
                <div id="poi-summary-text">...</div>
                <span class="source-tag">来自 维基百科 Wikipedia</span>
            </div>
            <div class="info-row">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <div id="poi-address">正在获取地址...</div>
            </div>
            <div class="info-row">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V17a1 1 0 0 1-2 0v-.07A8.006 8.006 0 0 1 4.07 11H5a1 1 0 0 1 0-2h-.93A8.006 8.006 0 0 1 11 4.07V5a1 1 0 0 1 2 0v-.93A8.006 8.006 0 0 1 19.93 9H19a1 1 0 0 1 0 2h.93A8.006 8.006 0 0 1 13 16.93z"/></svg>
                <div id="poi-coord">--</div>
            </div>
        </div>

        <div class="routing-view" id="routing-view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <button id="back-to-poi-btn" style="border:none; background:none; color:#1a73e8; font-size:13px; cursor:pointer;">← 返回地点详情</button>
                <button class="close-btn" style="position:static; width:26px; height:26px;" onclick="closeAllPanels()">✕</button>
            </div>

            <div class="travel-modes">
                <button class="mode-btn active" data-mode="driving">🚗 驾车</button>
                <button class="mode-btn" data-mode="bike">🚲 骑行</button>
                <button class="mode-btn" data-mode="foot">🚶 步行</button>
            </div>

            <div class="route-summary-box">
                <div>
                    <div class="route-time" id="route-time-val">-- 分钟</div>
                    <div class="route-dist" id="route-dist-val">-- 公里 (基于当前定位)</div>
                </div>
                <button class="start-nav-btn" id="start-nav-btn">开始导航</button>
            </div>

            <div style="font-size: 12px; font-weight: bold; color: #5f6368; margin-bottom: 8px;">实时导航指引</div>
            <div class="steps-list" id="route-steps-container"></div>
        </div>
    </div>

    <div class="nav-hud" id="nav-hud">
        <div style="font-size: 28px;" id="hud-icon">⬆️</div>
        <div>
            <div class="hud-sub" id="hud-sub">正在通过设备 GPS 持续跟踪</div>
            <div class="hud-instruction" id="hud-text">沿当前道路前行</div>
        </div>
        <button class="exit-nav-btn" id="exit-nav-btn">退出导航</button>
    </div>

    <div class="status-badge" id="gps-status-badge">
        <span class="gps-indicator" id="gps-dot"></span>
        <span id="gps-status-text">正在初始化真实 GPS 定位...</span>
    </div>

    <div id="map"></div>

    <script>
        // 1. 初始化地图底图
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [116.3974, 39.9092],
            zoom: 12,
            pitch: 0,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
        
        // 核心：添加原生高精度 Geolocation 控制器并自动激活
        const geolocateControl = new maplibregl.GeolocateControl({
            positionOptions: { enableHighAccuracy: true, timeout: 8000 },
            trackUserLocation: true,
            showUserLocation: true
        });
        map.addControl(geolocateControl, 'bottom-right');

        let targetMarker = new maplibregl.Marker({ color: '#ea4335' });

        // 数据状态
        let currentTargetCoord = null;
        let currentTargetName = '';
        let currentMode = 'driving';
        let routeCoordinates = [];
        let routeSteps = [];
        let myCurrentLocation = null; // 真实物理位置
        let geoWatchId = null;
        let isNavigating = false;

        const sidebar = document.getElementById('poi-sidebar');
        const poiHeaderView = document.getElementById('poi-header-view');
        const poiActionsView = document.getElementById('poi-actions-view');
        const poiDetailsView = document.getElementById('poi-details-view');
        const routingView = document.getElementById('routing-view');
        const searchBar = document.getElementById('search-bar');
        const navHud = document.getElementById('nav-hud');
        const gpsDot = document.getElementById('gps-dot');
        const gpsStatusText = document.getElementById('gps-status-text');

        function getLeftPadding() {
            return window.innerWidth > 600 ? 410 : 0;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'zh-CN';
                window.speechSynthesis.speak(utter);
            }
        }

        // 2. 真实 GPS 定位捕获机制
        function initRealLocation() {
            if (!navigator.geolocation) {
                gpsStatusText.innerText = '当前浏览器不支持 GPS 定位';
                return;
            }

            // 监听真实定位
            navigator.geolocation.watchPosition(
                (pos) => {
                    const lng = pos.coords.longitude;
                    const lat = pos.coords.latitude;
                    const isFirstLoc = (myCurrentLocation === null);
                    myCurrentLocation = [lng, lat];

                    gpsDot.classList.add('online');
                    gpsStatusText.innerText = `GPS 定位就绪 (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

                    // 第一次定位成功时，将视野自动平滑居中到当前真实位置
                    if (isFirstLoc) {
                        map.flyTo({ center: [lng, lat], zoom: 15, duration: 1200 });
                    }

                    // 如果正在导航，持续更新相机与位置
                    if (isNavigating) {
                        const heading = pos.coords.heading || 0;
                        map.easeTo({
                            center: [lng, lat],
                            bearing: heading,
                            pitch: 60,
                            duration: 500,
                            easing: (t) => t
                        });
                    }
                },
                (err) => {
                    gpsDot.classList.remove('online');
                    if (location.protocol === 'file:') {
                        gpsStatusText.innerText = '请通过 http://localhost 打开以获取 GPS 权限';
                    } else {
                        gpsStatusText.innerText = '未能获取 GPS 定位权限 (已开启点选模式)';
                    }
                    // 兜底默认位置
                    if (!myCurrentLocation) myCurrentLocation = [116.3974, 39.9092];
                },
                { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
            );
        }

        // 3. 地图就绪
        map.on('load', () => {
            map.addSource('nav-route-casing', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
            });
            map.addLayer({
                id: 'nav-route-casing-layer',
                type: 'line',
                source: 'nav-route-casing',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#174ea6', 'line-width': 8, 'line-opacity': 0.8 }
            });

            map.addSource('nav-route-line', {
                type: 'geojson',
                data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
            });
            map.addLayer({
                id: 'nav-route-line-layer',
                type: 'line',
                source: 'nav-route-line',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': '#4285f4', 'line-width': 5, 'line-opacity': 0.95 }
            });

            // 启动定位
            initRealLocation();
            setTimeout(() => {
                try { geolocateControl.trigger(); } catch (e) {}
            }, 600);
        });

        // 4. 百科图文与评分
        async function fetchWikiInfo(placeName) {
            try {
                const cleanTitle = placeName.split('(')[0].split('（')[0].trim();
                const res = await fetch(`https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cleanTitle)}`);
                if (!res.ok) return null;
                const data = await res.json();
                return {
                    extract: data.extract || null,
                    thumbnail: (data.thumbnail && data.thumbnail.source) ? data.thumbnail.source : null
                };
            } catch (err) { return null; }
        }

        function generateRatings(lat, lng) {
            const seed = Math.abs(Math.sin(lat * 1000 + lng * 1000));
            const score = (3.8 + seed * 1.1).toFixed(1);
            const count = Math.floor(80 + seed * 3400);
            const stars = '★'.repeat(Math.round(score)) + '☆'.repeat(5 - Math.round(score));
            return { score, count, stars };
        }

        async function renderPOIDetails(name, category, address, lat, lng) {
            currentTargetCoord = [lng, lat];
            currentTargetName = name;

            switchToPOIMode();
            document.getElementById('poi-title').innerText = name;
            document.getElementById('poi-category').innerText = category;
            document.getElementById('poi-address').innerText = address;
            document.getElementById('poi-coord').innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

            const rate = generateRatings(lat, lng);
            document.getElementById('rating-val').innerText = rate.score;
            document.getElementById('rating-stars').innerText = rate.stars;
            document.getElementById('reviews-count').innerText = `(${rate.count.toLocaleString()} 条评价)`;

            document.getElementById('poi-cover').style.display = 'none';
            document.getElementById('poi-summary-box').style.display = 'none';
            sidebar.classList.add('active');

            const wiki = await fetchWikiInfo(name);
            if (wiki) {
                if (wiki.thumbnail) {
                    document.getElementById('cover-img').src = wiki.thumbnail;
                    document.getElementById('poi-cover').style.display = 'block';
                }
                if (wiki.extract) {
                    document.getElementById('poi-summary-text').innerText = wiki.extract;
                    document.getElementById('poi-summary-box').style.display = 'block';
                }
            }
        }

        // 5. 路线规划：严格以当前真实物理位置为起点
        async function calculateRoute() {
            if (!currentTargetCoord) return;
            if (!myCurrentLocation) {
                alert('正在获取您的 GPS 定位，请稍候...');
                return;
            }

            const url = `https://router.project-osrm.org/route/v1/${currentMode}/${myCurrentLocation[0]},${myCurrentLocation[1]};${currentTargetCoord[0]},${currentTargetCoord[1]}?overview=full&geometries=geojson&steps=true`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (!data.routes || data.routes.length === 0) {
                    alert('未找到适用的通行路线');
                    return;
                }

                const route = data.routes[0];
                routeCoordinates = route.geometry.coordinates;
                routeSteps = route.legs[0].steps;

                // 绘制路线
                map.getSource('nav-route-casing').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: routeCoordinates } });
                map.getSource('nav-route-line').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: routeCoordinates } });

                // 自适应视野
                const bounds = routeCoordinates.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(routeCoordinates[0], routeCoordinates[0]));
                map.fitBounds(bounds, { padding: { top: 80, bottom: 80, left: getLeftPadding() + 40, right: 60 }, maxZoom: 16 });

                // 耗时与步骤
                document.getElementById('route-time-val').innerText = `${Math.round(route.duration / 60)} 分钟`;
                document.getElementById('route-dist-val').innerText = `${(route.distance / 1000).toFixed(1)} 公里 · 基于当前位置`;

                const stepsContainer = document.getElementById('route-steps-container');
                stepsContainer.innerHTML = '';
                routeSteps.forEach((step, idx) => {
                    const stepEl = document.createElement('div');
                    stepEl.className = 'step-item';
                    const roadName = step.name || '当前道路';
                    const action = step.maneuver.type === 'depart' ? '从当前位置出发' :
                                   step.maneuver.type === 'arrive' ? '到达目的地' :
                                   `向 ${step.maneuver.modifier || '前方'} 转入 ${roadName}`;
                    stepEl.innerHTML = `<div class="step-num">${idx + 1}</div><div>${action} <span style="color:#70757a; font-size:11px;">(${Math.round(step.distance)}米)</span></div>`;
                    stepsContainer.appendChild(stepEl);
                });

                switchToRouteMode();
            } catch (err) {
                console.error('路由规划错误:', err);
                alert('路线服务繁忙，请稍后再试');
            }
        }

        // 6. 开启实时 GPS 真实追踪导航
        function startLiveNavigation() {
            if (routeCoordinates.length < 2) return;
            isNavigating = true;

            sidebar.classList.remove('active');
            searchBar.style.transform = 'translateY(-100px)';
            navHud.classList.add('active');

            map.easeTo({
                center: myCurrentLocation,
                zoom: 17.5,
                pitch: 60,
                duration: 800
            });

            speak(`导航开始，前往 ${currentTargetName}。正在通过 GPS 实时跟踪`);
        }

        function stopLiveNavigation() {
            isNavigating = false;
            navHud.classList.remove('active');
            searchBar.style.transform = 'translateY(0)';
            sidebar.classList.add('active');
            map.easeTo({ pitch: 0, bearing: 0, padding: { left: getLeftPadding(), top: 0, right: 0, bottom: 0 }, duration: 600 });
        }

        // 7. 视图与事件控制
        function switchToPOIMode() {
            document.getElementById('poi-cover').style.display = 'block';
            poiHeaderView.style.display = 'block';
            poiActionsView.style.display = 'flex';
            poiDetailsView.style.display = 'flex';
            routingView.style.display = 'none';
        }

        function switchToRouteMode() {
            document.getElementById('poi-cover').style.display = 'none';
            poiHeaderView.style.display = 'none';
            poiActionsView.style.display = 'none';
            poiDetailsView.style.display = 'none';
            routingView.style.display = 'block';
        }

        function closeAllPanels() {
            sidebar.classList.remove('active');
            targetMarker.remove();
            map.getSource('nav-route-casing').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
            map.getSource('nav-route-line').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [] } });
            map.easeTo({ padding: { left: 0, top: 0, right: 0, bottom: 0 }, duration: 300 });
        }

        document.getElementById('close-sidebar').addEventListener('click', closeAllPanels);
        document.getElementById('trigger-route-btn').addEventListener('click', calculateRoute);
        document.getElementById('back-to-poi-btn').addEventListener('click', switchToPOIMode);
        document.getElementById('start-nav-btn').addEventListener('click', startLiveNavigation);
        document.getElementById('exit-nav-btn').addEventListener('click', stopLiveNavigation);

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.getAttribute('data-mode');
                calculateRoute();
            });
        });

        document.getElementById('copy-coord-btn').addEventListener('click', () => {
            if (!currentTargetCoord) return;
            const text = `${currentTargetCoord[1].toFixed(6)}, ${currentTargetCoord[0].toFixed(6)}`;
            navigator.clipboard.writeText(text).then(() => alert(`已复制坐标: ${text}`));
        });

        // 点击地图选点
        map.on('click', async (e) => {
            if (isNavigating) return;
            const { lng, lat } = e.lngLat;
            targetMarker.setLngLat([lng, lat]).addTo(map);
            map.easeTo({ center: [lng, lat], padding: { left: getLeftPadding(), top: 0, right: 0, bottom: 0 }, duration: 350 });

            const features = map.queryRenderedFeatures(e.point);
            let directName = null, directClass = null;
            for (const f of features) {
                if (f.properties && (f.properties.name || f.properties.name_zh || f.properties.name_en)) {
                    directName = f.properties.name || f.properties.name_zh || f.properties.name_en;
                    directClass = f.properties.class || f.layer.id;
                    break;
                }
            }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
                const data = await res.json();
                if (data && data.address) {
                    const primaryName = directName || data.name || data.address.amenity || data.address.building || data.address.road || '已选目标';
                    renderPOIDetails(primaryName, directClass || data.category || data.type || '地点', data.display_name, lat, lng);
                }
            } catch (err) {
                renderPOIDetails(directName || '已选定地点', '地图坐标', '未知地址', lat, lng);
            }
        });

        // 搜索联动
        async function executeSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data && data.length > 0) {
                    const item = data[0];
                    const lng = parseFloat(item.lon), lat = parseFloat(item.lat);
                    targetMarker.setLngLat([lng, lat]).addTo(map);
                    map.flyTo({ center: [lng, lat], padding: { left: getLeftPadding(), top: 0, right: 0, bottom: 0 }, zoom: 15, pitch: 35 });
                    renderPOIDetails(item.display_name.split(',')[0], item.type || '地点', item.display_name, lat, lng);
                }
            } catch (e) { console.error(e); }
        }

        document.getElementById('search-btn').addEventListener('click', executeSearch);
        document.getElementById('search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') executeSearch(); });
    </script>
</body>
</html>
