<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMap - POI 详情体验版</title>
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #map { width: 100%; height: 100%; }

        /* 顶部悬浮搜索框 */
        .search-container {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            background: #fff;
            width: 390px;
            max-width: calc(100vw - 32px);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.22);
            padding: 4px 12px;
        }
        .search-container input {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 8px;
            font-size: 15px;
            color: #202124;
        }
        .search-container button {
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            color: #5f6368;
        }
        .search-container button:hover { color: #1a73e8; }

        /* Google Maps 风格左侧详情侧边栏 */
        .sidebar {
            position: absolute;
            top: 72px;
            left: 16px;
            width: 390px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 96px);
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
            z-index: 15;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(-430px);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        .sidebar.active {
            transform: translateX(0);
            opacity: 1;
        }

        /* 侧边栏头部与封面 */
        .sidebar-header {
            position: relative;
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: #ffffff;
            padding: 24px 20px 16px 20px;
        }
        .sidebar-header .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: background 0.2s;
        }
        .sidebar-header .close-btn:hover { background: rgba(255, 255, 255, 0.35); }
        .sidebar-header h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; padding-right: 24px; line-height: 1.3; }
        .sidebar-header .category { font-size: 13px; opacity: 0.85; text-transform: capitalize; }

        /* 快捷功能按钮栏 */
        .action-row {
            display: flex;
            justify-content: space-around;
            padding: 14px 10px;
            border-bottom: 1px solid #f1f3f4;
            background: #fafafa;
        }
        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            cursor: pointer;
            gap: 6px;
            color: #1a73e8;
            font-size: 12px;
            font-weight: 500;
        }
        .action-btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #dadce0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a73e8;
            transition: background 0.15s;
        }
        .action-btn:hover .action-btn-icon { background: #e8f0fe; }

        /* 详情信息条目列表 */
        .details-body {
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .info-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            font-size: 14px;
            color: #3c4043;
            line-height: 1.4;
        }
        .info-row svg { flex-shrink: 0; color: #5f6368; margin-top: 2px; }

        /* 底部状态徽章 */
        .status-badge {
            position: absolute;
            bottom: 24px;
            left: 16px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #3c4043;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <!-- 顶部搜索框 -->
    <div class="search-container">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        <input type="text" id="search-input" placeholder="在 OpenMap 中搜索或点击任意地点..." />
        <button id="search-btn" title="搜索">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </button>
    </div>

    <!-- POI 详情侧边栏 -->
    <div class="sidebar" id="poi-sidebar">
        <div class="sidebar-header">
            <button class="close-btn" id="close-sidebar" title="关闭">✕</button>
            <h2 id="poi-title">地点加载中...</h2>
            <div class="category" id="poi-category">地名信息</div>
        </div>

        <div class="action-row">
            <button class="action-btn" onclick="alert('路线规划模块')">
                <div class="action-btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.71 11.29l-9-9a1 1 0 0 0-1.42 0l-9 9a1 1 0 0 0 0 1.42l9 9a1 1 0 0 0 1.42 0l9-9a1 1 0 0 0 0-1.42zm-8.71 6.3V14h-4v-4h4V6.41L18.59 12 13 17.59z"/></svg>
                </div>
                路线
            </button>
            <button class="action-btn" id="copy-coord-btn">
                <div class="action-btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                </div>
                复制坐标
            </button>
            <button class="action-btn" onclick="alert('链接已复制到剪贴板')">
                <div class="action-btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                </div>
                分享
            </button>
        </div>

        <div class="details-body" id="details-body">
            <div class="info-row">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <div id="poi-address">正在获取地址...</div>
            </div>
            <div class="info-row">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.93V17a1 1 0 0 1-2 0v-.07A8.006 8.006 0 0 1 4.07 11H5a1 1 0 0 1 0-2h-.93A8.006 8.006 0 0 1 11 4.07V5a1 1 0 0 1 2 0v-.93A8.006 8.006 0 0 1 19.93 9H19a1 1 0 0 1 0 2h.93A8.006 8.006 0 0 1 13 16.93z"/></svg>
                <div id="poi-coord">--</div>
            </div>
            <div class="info-row">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                <div id="poi-osm-type">OSM 节点类型：--</div>
            </div>
        </div>
    </div>

    <div class="status-badge">点击地图任意位置拾取 POI 详情</div>
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [116.3974, 39.9092],
            zoom: 14,
            pitch: 35,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');
        map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true }), 'bottom-right');

        let selectedMarker = new maplibregl.Marker({ color: '#ea4335' });

        const sidebar = document.getElementById('poi-sidebar');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const poiTitle = document.getElementById('poi-title');
        const poiCategory = document.getElementById('poi-category');
        const poiAddress = document.getElementById('poi-address');
        const poiCoord = document.getElementById('poi-coord');
        const poiOsmType = document.getElementById('poi-osm-type');
        const copyCoordBtn = document.getElementById('copy-coord-btn');

        let currentCoordText = '';

        // 计算屏幕宽度对应的动态左侧 padding（移动端屏幕小则不偏移，桌面端预留侧边栏空间）
        function getLeftPadding() {
            return window.innerWidth > 600 ? 410 : 0;
        }

        closeSidebarBtn.addEventListener('click', () => {
            sidebar.classList.remove('active');
            selectedMarker.remove();
            // 关闭侧边栏后，平滑复原 padding
            map.easeTo({
                padding: { left: 0, top: 0, right: 0, bottom: 0 },
                duration: 300
            });
        });

        copyCoordBtn.addEventListener('click', () => {
            if (!currentCoordText) return;
            navigator.clipboard.writeText(currentCoordText).then(() => {
                alert(`已复制坐标: ${currentCoordText}`);
            });
        });

        // 地图点击事件
        map.on('click', async (e) => {
            const { lng, lat } = e.lngLat;
            currentCoordText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

            // 保持标记精确定位在点击的经纬度上
            selectedMarker.setLngLat([lng, lat]).addTo(map);

            // 修复核心：保持真实坐标不变，使用 padding 将标记居中于侧边栏右侧区域
            map.easeTo({
                center: [lng, lat],
                padding: { left: getLeftPadding(), top: 0, right: 0, bottom: 0 },
                duration: 350
            });

            poiTitle.innerText = "正在获取地点信息...";
            poiCategory.innerText = "检索中";
            poiAddress.innerText = "正在逆地理编码解析...";
            poiCoord.innerText = currentCoordText;
            poiOsmType.innerText = "OSM 节点类型：查询中...";
            sidebar.classList.add('active');

            // 优先检查点选位置是否存在矢量切片要素
            const features = map.queryRenderedFeatures(e.point);
            let directFeatureName = null;
            let directFeatureClass = null;

            for (const feat of features) {
                if (feat.properties && (feat.properties.name || feat.properties.name_zh || feat.properties.name_en)) {
                    directFeatureName = feat.properties.name || feat.properties.name_zh || feat.properties.name_en;
                    directFeatureClass = feat.properties.class || feat.layer.id;
                    break;
                }
            }

            // 逆地理编码
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
                const data = await res.json();

                if (data && data.address) {
                    const primaryName = directFeatureName || data.name || data.address.amenity || data.address.building || data.address.road || '已选位置';
                    const category = directFeatureClass || data.category || data.type || '地点';

                    poiTitle.innerText = primaryName;
                    poiCategory.innerText = category;
                    poiAddress.innerText = data.display_name;
                    poiOsmType.innerText = `类型：${data.type} · OSM ID：${data.osm_id || 'N/A'}`;
                } else {
                    fallbackDirectInfo(directFeatureName, directFeatureClass);
                }
            } catch (err) {
                fallbackDirectInfo(directFeatureName, directFeatureClass);
            }
        });

        function fallbackDirectInfo(name, category) {
            poiTitle.innerText = name || "已选定地点";
            poiCategory.innerText = category || "地图坐标点";
            poiAddress.innerText = "无网络连接或无法取得详细街道地址";
            poiOsmType.innerText = "类型：坐标点";
        }

        // 搜索框联动
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');

        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const res = data[0];
                    const lng = parseFloat(res.lon);
                    const lat = parseFloat(res.lat);

                    selectedMarker.setLngLat([lng, lat]).addTo(map);

                    map.flyTo({
                        center: [lng, lat],
                        padding: { left: getLeftPadding(), top: 0, right: 0, bottom: 0 },
                        zoom: 15,
                        pitch: 35,
                        speed: 1.2
                    });

                    poiTitle.innerText = res.display_name.split(',')[0];
                    poiCategory.innerText = res.type || '检索结果';
                    poiAddress.innerText = res.display_name;
                    currentCoordText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    poiCoord.innerText = currentCoordText;
                    poiOsmType.innerText = `类型：${res.type} · 类别：${res.class}`;
                    sidebar.classList.add('active');
                }
            } catch (e) {
                console.error(e);
            }
        }

        searchBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') executeSearch();
        });
    </script>
</body>
</html>
