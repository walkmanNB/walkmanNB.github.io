<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽水音乐 LRC 歌词解析提取器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            text-align: center;
            color: #00e676;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #00e676;
        }
        button {
            padding: 12px 20px;
            background: #00e676;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.85;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status {
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 20px;
        }
        .status.error { color: #ff5252; }
        .status.success { color: #00e676; }
        .status.info { color: #29b6f6; }
        textarea {
            width: 100%;
            height: 320px;
            box-sizing: border-box;
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            color: #d1d1d1;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            white-space: pre;
        }
        .actions {
            margin-top: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>汽水音乐 LRC 歌词解析工具</h2>
    <div class="input-group">
        <input type="text" id="songUrl" placeholder="粘贴汽水音乐分享链接 (例如: https://www.qishui.com/share/track?track_id=...)" />
        <button id="parseBtn" onclick="startParse()">解析歌词</button>
    </div>
    <div id="status" class="status"></div>
    <textarea id="output" readonly placeholder="标准 LRC 歌词将在此处生成..."></textarea>
    <div class="actions">
        <button id="copyBtn" onclick="copyLrc()" style="display:none; background:#333; color:#fff;">复制歌词</button>
        <button id="downloadBtn" onclick="downloadLrc()" style="display:none;">下载 .lrc 文件</button>
    </div>
</div>

<script>
let currentTrackName = "lyrics";

function setStatus(text, type = "info") {
    const statusEl = document.getElementById("status");
    statusEl.innerText = text;
    statusEl.className = "status " + type;
}

// HTML 实体解码
function unescapeHtml(str) {
    const txt = document.createElement("textarea");
    txt.innerHTML = str;
    return txt.value;
}

// 核心转换逻辑
function convertJsonToLrc(htmlText) {
    // 匹配包含完整 loaderData 的 _ROUTER_DATA 块
    const regex = /_ROUTER_DATA\s*=\s*(\{.+?\});\s*<\/script>/s;
    let match = htmlText.match(regex);
    
    if (!match) {
        const regexFallback = /_ROUTER_DATA\s*=\s*(\{.+?\});/s;
        match = htmlText.match(regexFallback);
    }

    if (!match) {
        throw new Error("未能从网页源码中找到 _ROUTER_DATA 歌词数据模块");
    }

    const data = JSON.parse(match[1]);
    const trackPage = data?.loaderData?.track_page;
    
    if (!trackPage || !trackPage.audioWithLyricsOption?.lyrics?.sentences) {
        throw new Error("该歌曲页面数据中未包含歌词列表 (lyrics.sentences)");
    }

    // 记录曲名便于导出保存
    currentTrackName = trackPage.trackInfo?.name || trackPage.trackName || "lyrics";

    const sentences = trackPage.audioWithLyricsOption.lyrics.sentences;
    const lrcLines = [];

    for (const item of sentences) {
        const startMs = item.startMs || 0;
        if (startMs > 86400000) continue; // 过滤异常时间戳

        const text = unescapeHtml(item.text || "");
        const totalSeconds = startMs / 1000.0;
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = Math.floor(totalSeconds % 60);
        const hundredths = Math.floor((startMs % 1000) / 10);

        const mm = String(minutes).padStart(2, '0');
        const ss = String(seconds).padStart(2, '0');
        const xx = String(hundredths).padStart(2, '0');

        lrcLines.push(`[${mm}:${ss}.${xx}]${text}`);
    }

    return lrcLines.join("\n");
}

async function startParse() {
    const urlInput = document.getElementById("songUrl").value.trim();
    const parseBtn = document.getElementById("parseBtn");
    const output = document.getElementById("output");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");

    if (!urlInput) {
        setStatus("请输入有效的汽水音乐链接", "error");
        return;
    }

    // 提取出纯 URL（兼容带有中文分享文本的输入）
    const matchUrl = urlInput.match(/https?:\/\/[^\s]+/);
    if (!matchUrl) {
        setStatus("未能识别出有效网址", "error");
        return;
    }
    const targetUrl = matchUrl[0];

    parseBtn.disabled = true;
    setStatus("正在拉取网页内容，请稍候...", "info");
    output.value = "";
    copyBtn.style.display = "none";
    downloadBtn.style.display = "none";

    try {
        // 使用免费 CORS 代理解决浏览器跨域限制
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const response = await fetch(proxyUrl);
        
        if (!response.ok) {
            throw new Error(`网络代理请求失败 (状态码: ${response.status})`);
        }

        const data = await response.json();
        const htmlContent = data.contents;

        if (!htmlContent) {
            throw new Error("获取到的网页内容为空");
        }

        const lrcResult = convertJsonToLrc(htmlContent);
        output.value = lrcResult;
        setStatus("解析成功！", "success");
        copyBtn.style.display = "inline-block";
        downloadBtn.style.display = "inline-block";
    } catch (err) {
        setStatus(`解析失败: ${err.message}`, "error");
    } finally {
        parseBtn.disabled = false;
    }
}

function copyLrc() {
    const output = document.getElementById("output");
    navigator.clipboard.writeText(output.value).then(() => {
        alert("歌词已复制到剪贴板！");
    });
}

function downloadLrc() {
    const text = document.getElementById("output").value;
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${currentTrackName}.lrc`;
    a.click();
    URL.revokeObjectURL(a.href);
}
</script>

</body>
</html>
